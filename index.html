<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poland & Prague Trip</title>
  <meta name="description" content="Plan our Poland trip day by day: swipe through ideas, see travel times, and keep days from getting overbooked.">
  <meta name="theme-color" content="#b91c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇵🇱</text></svg>">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
</head>
<body>
  <header class="top">
    <div class="top-text">
      <h1 id="title">Poland Trip</h1>
      <div id="subtitle" class="muted small"></div>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu: share, export and settings">⋯<span id="badge" class="badge" hidden></span></button>
  </header>

  <main id="main"><p class="loading">Loading trip…</p></main>
  <div id="savebar"></div>

  <nav class="tabs" aria-label="Views">
    <button data-view="trip"><span>🗓️</span>Trip</button>
    <button data-view="day"><span>📍</span>Day</button>
    <button data-view="swipe"><span>💘</span>Swipe</button>
    <button data-view="ideas"><span>💡</span>Ideas</button>
  </nav>

  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
