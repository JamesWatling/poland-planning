name: Apply saved changes and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to commit changes saved from the website
  pages: write
  id-token: write

# One run at a time, never cancelled midway, so two people saving at once can't clobber each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, not the triggering commit, so earlier runs' applied changes are included
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes saved from the website (data/inbox)
        run: |
          if ls data/inbox/*.json >/dev/null 2>&1; then
            node scripts/apply-changes.mjs
            git config user.name "poland-planner-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "Apply changes saved from the website" || exit 0
            for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i * 3)); done
          fi
      - name: Validate trip data
        run: node scripts/validate.mjs
      - name: Stamp asset versions (cache-busting)
        run: sed -i "s/__VERSION__/$(git rev-parse --short HEAD)-${{ github.run_number }}/g" index.html app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
